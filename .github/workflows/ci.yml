name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev --python ${{ matrix.python-version }}
      - run: uv run pytest

  oldest:
    name: Tests (oldest supported Python and redis-py)
    runs-on: ubuntu-latest
    # A real server as well, since what fakeredis cannot run -- Redis Functions
    # and script flags -- is exactly what old redis-py spells differently.
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev --python 3.10
      # The redis-py floor the docs name is only a claim until something runs on it.
      # fakeredis declares redis>=4.3 but works on 4.2, the first release with
      # redis.asyncio, so the pin goes in after the resolver is done.
      - run: uv pip install --no-deps "redis==4.2.0" async-timeout deprecated packaging
      - run: uv run --no-sync pytest
      - run: uv run --no-sync pytest
        env:
          REDIS_URL: redis://localhost:6379/0

  live:
    name: Tests against a real Redis
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      # fakeredis embeds a Lua interpreter, but only a real server settles
      # questions about reply conversion and the script cache.
      - run: uv run pytest
        env:
          REDIS_URL: redis://localhost:6379/0
