name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional:
    name: Conventional commit format
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Squash-merging makes the PR title the commit subject on main, which is
      # the only thing release-please reads. A malformed title here is a change
      # silently missing from the next changelog, so it is checked up front.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            deps
            docs
            test
            ci
            build
            chore
            style
          # The subject is the changelog line; keep it a lowercase phrase.
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: >-
            The subject "{subject}" of pull request "{title}" should start
            lowercase and not end with a period, because it is used verbatim
            as a changelog entry.
