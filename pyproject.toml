[project]
name = "redis-lua-py"
version = "0.4.0"
description = "Write Redis Lua scripts as real Python functions, not strings."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ignace Maes" }]
keywords = ["redis", "lua", "eval", "evalsha", "transpiler", "scripting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Lua",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = ["redis>=4.2"]

[project.urls]
Homepage = "https://ignacemaes.com/redis-lua-py/"
Documentation = "https://ignacemaes.com/redis-lua-py/"
Repository = "https://github.com/ignacemaes/redis-lua-py"
Issues = "https://github.com/ignacemaes/redis-lua-py/issues"
Changelog = "https://github.com/ignacemaes/redis-lua-py/blob/main/CHANGELOG.md"

[project.scripts]
redis-lua-py = "redis_lua_py.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "fakeredis[lua]>=2.30",
    "ruff>=0.16",
    "mypy>=1.15",
    "zensical>=0.0.61",
    # typing.assert_type, for tests/test_typing.py, arrived in Python 3.11.
    "typing_extensions>=4.2; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redis_lua_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
# UnsupportedSyntax deliberately mirrors Python's own SyntaxError, which
# likewise carries no Error suffix.
"src/redis_lua_py/errors.py" = ["N818"]
# Test modules are mostly script bodies: Python that is compiled to Lua and
# never executed. Advice about unused loop variables and assignments does not
# apply to them, and SIM108 suggests the conditional expressions that this
# compiler deliberately rejects.
"tests/*.py" = ["B007", "F841", "SIM108"]

[tool.mypy]
python_version = "3.10"
strict = true
# test_typing.py carries assert_type() claims about what a call returns, which
# are only worth anything if mypy actually reads them.
files = ["src", "tests/test_typing.py"]
mypy_path = "tests"

# A script body returns Lua-side values, whose Python type is Any by
# construction -- nothing about `redis.get(k)` is knowable to a type checker.
# Under strict, warn_return_any flags exactly that, on the one function whose
# body Python never runs. Adopters need the same override; the README says so.
[[tool.mypy.overrides]]
module = "test_typing"
warn_return_any = false
